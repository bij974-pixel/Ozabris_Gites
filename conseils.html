<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title-meta">Conseils Personnalisés | Les Ozabris</title>
<style>
:root { --primary: #12263a; --accent: #c5a880; --text-dark: #2c3e50; --white: #ffffff; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Playfair Display', 'Georgia', serif; }
body {
width: 100vw;
min-height: 100vh;
margin: 0;
padding: 10px;
background: linear-gradient(rgba(18, 38, 58, 0.75), rgba(18, 38, 58, 0.85)), url('fond_page.png') no-repeat center center fixed;
background-size: cover;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
}
header {
background: var(--primary);
text-align: center;
padding: 20px 20px 15px 20px;
border-bottom: 2px solid var(--accent);
position: relative;
color: var(--white);
width: 100%;
max-width: 950px;
border-top-left-radius: 16px;
border-top-right-radius: 16px;
border: 2px solid var(--accent);
border-bottom: none;
}
.header-top-controls { position: absolute; top: 12px; right: 15px; display: block; z-index: 10; }
.btn-admin {
font-family: 'Segoe UI', sans-serif;
font-size: 0.75rem;
background: var(--accent);
border: 1px solid var(--accent);
color: var(--primary);
padding: 6px 14px;
border-radius: 20px;
cursor: pointer;
font-weight: 700;
box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.btn-admin:hover { background: var(--white); }
.brand-logo-container { max-width: 110px; margin: 0 auto 6px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 2px solid var(--accent); }
.brand-logo-container img { width: 100%; height: auto; object-fit: contain; display: block; }
.logo-text { font-size: 1.6rem; font-weight: 300; letter-spacing: 3px; color: var(--white); text-transform: uppercase; margin-bottom: 2px; }
.subtitle { font-family: 'Segoe UI', sans-serif; font-size: 0.65rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; display: block; }
.tv-card {
background: rgba(255, 255, 255, 0.98);
width: 100%;
max-width: 950px;
border-bottom-left-radius: 16px;
border-bottom-right-radius: 16px;
padding: 15px 25px;
box-shadow: 0 20px 40px rgba(0,0,0,0.4);
border: 2px solid var(--accent);
border-top: none;
display: flex;
flex-direction: column;
justify-content: space-between;
text-align: center;
margin: auto;
position: relative;
}
.card-header { margin-bottom: 10px; }
h2 { color: var(--primary); font-size: 1.5rem; font-weight: 400; margin-bottom: 2px; }
.welcome-sub { font-family: 'Segoe UI', sans-serif; font-size: 0.78rem; color: #555; font-style: italic; }
.advice-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
margin-bottom: 12px;
max-height: 52vh;
overflow-y: auto;
padding-right: 8px;
-webkit-overflow-scrolling: touch;
}
.advice-box {
background: var(--white);
border: 1px solid var(--accent);
border-radius: 10px;
padding: 12px;
text-align: left;
font-family: 'Segoe UI', sans-serif;
display: flex;
flex-direction: column;
justify-content: space-between;
cursor: pointer;
transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.advice-box:hover {
transform: translateY(-2px);
box-shadow: 0 6px 15px rgba(0,0,0,0.1);
border-color: var(--primary);
}
.advice-box h3 { font-size: 0.9rem; color: var(--primary); margin-bottom: 4px; font-family: 'Playfair Display', serif; }
.advice-box p { font-size: 0.78rem; color: #555; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.advice-img-wrapper {
width: 100%;
max-height: 120px;
background-color: #fcfbfa;
border-radius: 6px;
border: 1px solid #eee;
margin-top: 6px;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
padding: 4px;
}
.advice-box img {
width: 100%;
max-height: 110px;
object-fit: contain;
display: block;
}
.advice-box a { color: var(--primary); font-weight: bold; text-decoration: underline; font-size: 0.78rem; display: inline-block; margin-top: 2px; pointer-events: none; }
.footer-actions { display: flex; justify-content: center; align-items: center; border-top: 1px solid rgba(197,168,128,0.4); padding-top: 10px; font-family: 'Segoe UI', sans-serif; }
.btn-action { background-color: var(--primary); color: white; padding: 8px 22px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; border: none; text-decoration: none; display: inline-block; transition: background 0.2s; }
.btn-action:hover { background-color: var(--accent); color: var(--primary); }
/* Modale interactive pour affichage complet et défilement */
#detail-modal {
display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 38, 58, 0.85); justify-content: center; align-items: center; z-index: 2000; font-family: 'Segoe UI', sans-serif; padding: 20px;
}
.detail-modal-content {
background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 550px; max-height: 85vh; overflow-y: auto; text-align: left; border: 2px solid var(--accent); box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative;
}
.detail-modal-content h3 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: 1.3rem; margin-bottom: 10px; }
.detail-modal-content p { font-size: 0.95rem; color: #444; line-height: 1.5; margin-bottom: 15px; }
.detail-modal-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px; background: #fcfbfa; }
.detail-modal-btn-link { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; display: inline-block; font-size: 0.9rem; transition: background 0.2s; }
.detail-modal-btn-link:hover { background: var(--accent); color: var(--primary); }
.detail-close-btn { float: right; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--primary); font-weight: bold; }
/* Modale PIN Admin */
#admin-modal {
display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 38, 58, 0.85); justify-content: center; align-items: center; z-index: 1000; font-family: 'Segoe UI', sans-serif;
}
.modal-content {
background: white; padding: 25px; border-radius: 14px; width: 90%; max-width: 320px; text-align: center; border: 2px solid var(--accent);
}
.modal-content input {
width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; text-align: center;
}
.modal-btn {
background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 0.85rem; text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center;
}
.modal-btn:hover { background: var(--accent); color: var(--primary); }
</style>
</head>
<body>
<header>
<div class="header-top-controls" id="admin-container">
<button type="button" class="btn-admin" onclick="openPinModal()">⚙️ Admin</button>
</div>
<div class="brand-logo-container">
<img src="https://i.postimg.cc/DzsCFbvh/IMG-0798.jpg" alt="Les Ozabris Logo">
</div>
<h1 class="logo-text">Les Ozabris</h1>
<span class="subtitle">Cottages de Prestige & Perles Rares • La Réunion</span>
</header>
<div class="tv-card">
<div class="card-header">
<h2 id="page-main-title">Recommandations exclusives</h2>
<p id="page-main-sub" class="welcome-sub">🌿 Chargement de vos recommandations personnalisées...</p>
</div>
<div class="advice-grid" id="advice-grid-container">
<p style="text-align: center; color: #666; font-family: 'Segoe UI', sans-serif; grid-column: span 2; padding: 20px;">Chargement...</p>
</div>
<div class="footer-actions">
<a id="back-home-btn" href="index.html" class="btn-action">🏠 Retour à l'accueil</a>
</div>
</div>
<!-- Modale de détail d'un conseil -->
<div id="detail-modal" onclick="closeDetailModal(event)">
<div class="detail-modal-content" onclick="event.stopPropagation()">
<button type="button" class="detail-close-btn" onclick="closeDetailModal()">✕</button>
<h3 id="modal-advice-title">Titre</h3>
<p id="modal-advice-text">Description complète...</p>
<div id="modal-advice-img-container" style="text-align: center;"></div>
<div id="modal-advice-link-container" style="margin-top: 15px; text-align: center;"></div>
</div>
</div>
<!-- Modale de saisie du PIN -->
<div id="admin-modal">
<div class="modal-content">
<button type="button" onclick="closePinModal()" style="float: right; background: none; border: none; font-size: 1.1rem; cursor: pointer;">✕</button>
<h3>🔒 Accès Admin</h3>
<p style="font-size: 0.8rem; color: #666; margin: 5px 0;">Code PIN de sécurité</p>
<input type="password" id="adminPin" placeholder="PIN" maxlength="6">
<button type="button" class="modal-btn" onclick="verifyPin()">Valider</button>
<p id="adminError" style="color: #b94a48; font-size: 0.75rem; margin-top: 8px; display: none;">Code incorrect</p>
</div>
</div>
<script>
const sheetVoyageursApiUrl = "https://script.google.com/macros/s/AKfycbx8IpsGljXVcaPPMIU54K9aCsQqdIK_KzsvelChbG4dMUpeVSHaAnKu2Ww8CAsl-2Qq/exec";
const sheetConseilsApiUrl = "https://script.google.com/macros/s/AKfycbzdEv_frdNqscUxHQW6xXpePamOztmC0xLWa5CRMjY4fFsKuMdcvJda7fDkXiWqAYcu1A/exec";
let cachedAdvices = [];
let currentGiteKey = 'ptitzabris';
window.onload = async function() {
const urlParams = new URLSearchParams(window.location.search);
const giteParam = (urlParams.get('gite') || 'ptitzabris').toLowerCase();
currentGiteKey = giteParam.includes("grand") ? "grandzabris" : "ptitzabris";
let cottageName = currentGiteKey === "grandzabris" ? "Grandzabris" : "Ptitzabris";
document.getElementById('back-home-btn').href = ⁠index.html?gite=${currentGiteKey}&v=99⁠;
const isFullyKiosk = typeof window.fully !== 'undefined' || navigator.userAgent.includes("Fully");
const adminContainer = document.getElementById('admin-container');
const currentHost = window.location.hostname;
const isBoxTV = currentHost.endsWith(".93") || currentHost.endsWith(".145") || currentHost === "192.168.1.93" || currentHost === "192.168.1.145";
if (isFullyKiosk || isBoxTV) {
adminContainer.style.display = 'none';
} else {
adminContainer.style.display = 'block';
}
await loadPageData(currentGiteKey, cottageName);
const adminPin = document.getElementById('adminPin');
if (adminPin) {
adminPin.addEventListener('keypress', function(e) {
if (e.key === 'Enter') verifyPin();
});
}
}
async function loadPageData(cottageKey, cottageName) {
const container = document.getElementById('advice-grid-container');
const titleEl = document.getElementById('page-main-title');
const subEl = document.getElementById('page-main-sub');
try {
const resVoyageurs = await fetch(sheetVoyageursApiUrl + "?t=" + new Date().getTime());
const voyageurs = await resVoyageurs.json();
const today = new Date();
today.setHours(0, 0, 0, 0);
let voyageurActuel = null;
if (Array.isArray(voyageurs) && voyageurs.length > 0) {
voyageurActuel = voyageurs.find(v => {
const cottageStr = String(v.cottage || '').toLowerCase();
const matchCottage = cottageKey === 'grandzabris' ? cottageStr.includes('grand') : (cottageStr.includes('ptit') || cottageStr.includes('petit'));
const arrStr = v.dateArrivee || v.arrivee;
const depStr = v.dateDepart || v.depart;
if (matchCottage && arrStr && depStr) {
const arrDate = new Date(arrStr);
const depDate = new Date(depStr);
arrDate.setHours(0, 0, 0, 0);
depDate.setHours(0, 0, 0, 0);
return today >= arrDate && today <= depDate;
}
return false;
});
}
if (voyageurActuel && voyageurActuel.prenom) {
titleEl.innerText = ⁠Recommandations exclusives pour ${voyageurActuel.prenom}⁠;
} else {
titleEl.innerText = ⁠Recommandations exclusives au ${cottageName}⁠;
}
subEl.innerHTML = ⁠✨ Sélection sur-mesure de nos plus belles adresses, imaginée spécialement pour votre séjour aux Ozabris. (Cliquez sur une carte pour tout lire)⁠;
const response = await fetch(sheetConseilsApiUrl + "?type=conseils&t=" + new Date().getTime());
const data = await response.json();
cachedAdvices = Array.isArray(data) ? data : (data.conseils || data.rows || data.data || []);
if (!Array.isArray(cachedAdvices) || cachedAdvices.length === 0) {
container.innerHTML = ⁠<p style="text-align: center; color: #666; font-family: 'Segoe UI', sans-serif; grid-column: span 2; padding: 20px;">Conseils et recommandations à venir.</p>⁠;
return;
}
renderActiveAdvices();
} catch (e) {
container.innerHTML = ⁠<p style="text-align: center; color: #b94a48; font-family: 'Segoe UI', sans-serif; grid-column: span 2; padding: 20px;">Conseils et recommandations à venir.</p>⁠;
}
}
function renderActiveAdvices() {
const container = document.getElementById('advice-grid-container');
container.innerHTML = "";
let activeCount = 0;
cachedAdvices.forEach((adv, index) => {
const titleText = adv.title || adv['Nom de la recommandation'] || '';
if (!titleText || titleText.trim() === '') return;
const localState = localStorage.getItem(⁠${currentGiteKey}_advice_active_${index}⁠);
let isActive = true;
if (localState !== null) {
isActive = (localState === 'true');
}
if (isActive) {
activeCount++;
const box = document.createElement('div');
box.className = 'advice-box';
const descText = adv.text || adv['Commentaire sur la recommandation'] || '';
const imageUrl = adv.img || adv['Lien postimage'] || '';
const linkUrl = adv.linkUrl || adv['Lien web'] || '';
// Action de clic pour ouvrir la modale complète
box.onclick = function() {
openDetailModal(titleText, descText, imageUrl, linkUrl);
};
let imgHtml = "";
if (imageUrl && imageUrl.trim() !== "" && imageUrl.startsWith("http")) {
imgHtml = ⁠<div class="advice-img-wrapper"> <img src="${imageUrl.trim()}" alt="${titleText}"> </div>⁠;
}
let linkHtml = "";
if (linkUrl && linkUrl.trim() !== "" && linkUrl.startsWith("http")) {
linkHtml = ⁠<p style="margin-top: 6px;"><a>Découvrir ${titleText} ↗</a></p>⁠;
}
box.innerHTML = ⁠<div> <h3>${titleText}</h3> <p>${descText}</p> ${linkHtml} </div> ${imgHtml}⁠;
container.appendChild(box);
}
});
if (activeCount === 0) {
container.innerHTML = ⁠<p style="text-align: center; color: #666; font-family: 'Segoe UI', sans-serif; grid-column: span 2; padding: 20px;">Conseils et recommandations à venir.</p>⁠;
}
}
function openDetailModal(title, text, imageUrl, linkUrl) {
document.getElementById('modal-advice-title').innerText = title;
document.getElementById('modal-advice-text').innerText = text;
const imgContainer = document.getElementById('modal-advice-img-container');
if (imageUrl && imageUrl.trim() !== "" && imageUrl.startsWith("http")) {
imgContainer.innerHTML = ⁠<img src="${imageUrl.trim()}" alt="${title}" class="detail-modal-img">⁠;
} else {
imgContainer.innerHTML = "";
}
const linkContainer = document.getElementById('modal-advice-link-container');
if (linkUrl && linkUrl.trim() !== "" && linkUrl.startsWith("http")) {
linkContainer.innerHTML = ⁠<a href="${linkUrl.trim()}" target="_blank" class="detail-modal-btn-link">Découvrir ${title} ↗</a>⁠;
} else {
linkContainer.innerHTML = "";
}
document.getElementById('detail-modal').style.display = 'flex';
}
function closeDetailModal(event) {
if (!event || event.target.id === 'detail-modal' || event.target.classList.contains('detail-close-btn')) {
document.getElementById('detail-modal').style.display = 'none';
}
}
function openPinModal() {
document.getElementById('admin-modal').style.display = 'flex';
document.getElementById('adminPin').focus();
}
function closePinModal() {
document.getElementById('admin-modal').style.display = 'none';
document.getElementById('adminError').style.display = 'none';
document.getElementById('adminPin').value = '';
}
function verifyPin() {
const pin = document.getElementById('adminPin').value.trim();
if (pin === '140769') {
window.location.href = ⁠admin.html?gite=${currentGiteKey}⁠;
} else {
document.getElementById('adminError').style.display = 'block';
document.getElementById('adminPin').value = '';
}
}
</script>
</body>
</html>

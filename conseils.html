
<script>
/* Navigation TV Ozabris — correction retour accueil */
(function(){
  'use strict';

  const params = new URLSearchParams(location.search);
  if(params.get('tv') !== '1') return;

  const gite = params.get('gite') === 'grandzabris'
    ? 'grandzabris' : 'ptitzabris';

  const home = document.getElementById('tvHome');
  const menu = document.getElementById('tvMenu');

  if(!home || !menu) return;

  home.href = 'index.html?gite=' +
    encodeURIComponent(gite) + '&tv=1';

  home.tabIndex = 0;

  function buttons(){
    return Array.from(menu.querySelectorAll('button'));
  }

  function focusHome(){
    home.focus();
  }

  function focusMenu(){
    const items = buttons();
    if(!items.length) return;

    const selected = menu.querySelector('.selected');
    (selected || items[0]).focus();
  }

  function goHome(){
    window.location.assign(home.href);
  }

  home.addEventListener('click', function(){
    window.location.assign(home.href);
  });

  document.addEventListener('keydown', function(event){
    const modal = document.getElementById('modal');
    if(modal && modal.classList.contains('open')) return;

    const key = event.key;
    const active = document.activeElement;
    const items = buttons();
    const inMenu = items.includes(active);

    if(key === 'Escape' || key === 'Backspace' ||
       key === 'BrowserBack'){
      event.preventDefault();
      event.stopImmediatePropagation();
      goHome();
      return;
    }

    if(active === home){
      if(key === 'Enter' || key === ' '){
        event.preventDefault();
        event.stopImmediatePropagation();
        goHome();
        return;
      }

      if(key === 'ArrowDown' || key === 'ArrowRight'){
        event.preventDefault();
        event.stopImmediatePropagation();
        focusMenu();
        return;
      }
    }

    if(inMenu && key === 'ArrowUp'){
      event.preventDefault();
      event.stopImmediatePropagation();
      focusHome();
      return;
    }

    if(!inMenu && active !== home &&
       (key === 'ArrowUp' || key === 'ArrowLeft')){
      event.preventDefault();
      event.stopImmediatePropagation();
      focusHome();
    }
  }, true);

  home.style.outlineOffset = '4px';

  const style = document.createElement('style');
  style.textContent = `
    body.tv-mode .tv-home {
      opacity:1!important;
      pointer-events:auto!important;
      cursor:pointer!important;
    }
    body.tv-mode .tv-home:focus {
      outline:5px solid #ffcc48!important;
      outline-offset:4px!important;
      background:#fff2c4!important;
      color:#12263a!important;
      box-shadow:0 0 0 7px rgba(255,204,72,.25);
    }
  `;
  document.head.appendChild(style);
})();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title-meta">Conseils Personnalisés | Les Ozabris</title>
    <style>
        :root { --primary: #12263a; --accent: #c5a880; --text-dark: #2c3e50; --white: #ffffff; --tropical-green: #1b4d3e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Playfair Display', 'Georgia', serif; }
        
        body {
            width: 100vw;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background: linear-gradient(rgba(18, 38, 58, 0.75), rgba(18, 38, 58, 0.85)), url('fond_page.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header { 
            background: var(--primary);
            text-align: center; 
            padding: 25px 20px 20px 20px; 
            border-bottom: 2px solid var(--accent); 
            position: relative; 
            color: var(--white);
            width: 100%;
            max-width: 950px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            border: 2px solid var(--accent);
            border-bottom: none;
        }

        .header-top-controls { position: absolute; top: 12px; right: 15px; display: block; }
        .btn-admin {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.75rem;
            background: var(--accent);
            border: 1px solid var(--accent);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-admin:hover { background: var(--white); }

        .brand-logo-container { max-width: 120px; margin: 0 auto 8px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 2px solid var(--accent); }
        .brand-logo-container img { width: 100%; height: auto; object-fit: contain; display: block; }
        
        .logo-text { font-size: 1.8rem; font-weight: 300; letter-spacing: 3px; color: var(--white); text-transform: uppercase; margin-bottom: 2px; }
        .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 0.7rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; display: block; }

        .tv-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 950px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            padding: 20px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid var(--accent);
            border-top: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            margin: auto;
            position: relative;
        }

        .card-header { margin-bottom: 15px; }
        h2 { color: var(--primary); font-size: 1.8rem; font-weight: 400; margin-bottom: 3px; }
        .welcome-sub { font-family: 'Segoe UI', sans-serif; font-size: 0.85rem; color: #555; font-style: italic; }

        .advice-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-bottom: 15px; 
            max-height: 55vh; 
            overflow-y: auto; 
            padding-right: 5px; 
        }

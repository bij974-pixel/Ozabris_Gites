<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title-meta">Conseils Personnalisés | Les Ozabris</title>
    <style>
        :root { --primary: #12263a; --accent: #c5a880; --text-dark: #2c3e50; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Playfair Display', 'Georgia', serif; }
        
        body {
            width: 100vw;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background: linear-gradient(rgba(18, 38, 58, 0.75), rgba(18, 38, 58, 0.85)), url('fond_page.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header { 
            background: var(--primary);
            text-align: center; 
            padding: 20px 20px 15px 20px; 
            border-bottom: 2px solid var(--accent); 
            position: relative; 
            color: var(--white);
            width: 100%;
            max-width: 950px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            border: 2px solid var(--accent);
            border-bottom: none;
        }

        .header-top-controls { position: absolute; top: 12px; right: 15px; display: block; z-index: 10; }
        .btn-admin {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.75rem;
            background: var(--accent);
            border: 1px solid var(--accent);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .btn-admin:hover { background: var(--white); }

        .brand-logo-container { max-width: 110px; margin: 0 auto 6px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 2px solid var(--accent); }
        .brand-logo-container img { width: 100%; height: auto; object-fit: contain; display: block; }
        
        .logo-text { font-size: 1.6rem; font-weight: 300; letter-spacing: 3px; color: var(--white); text-transform: uppercase; margin-bottom: 2px; }
        .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 0.65rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; display: block; }

        .tv-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 950px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            padding: 15px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid var(--accent);
            border-top: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            margin: auto;
            position: relative;
        }

        .card-header { margin-bottom: 10px; }
        h2 { color: var(--primary); font-size: 1.6rem; font-weight: 400; margin-bottom: 2px; }
        .welcome-sub { font-family: 'Segoe UI', sans-serif; font-size: 0.8rem; color: #555; font-style: italic; }

        .advice-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-bottom: 12px; 
            max-height: 52vh; 
            overflow-y: auto; 
            padding-right: 8px; 
            -webkit-overflow-scrolling: touch;
        }
        
        .advice-box { background: var(--white); border: 1px solid var(--accent); border-radius: 10px; padding: 12px; text-align: left; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: space-between; }
        .advice-box h3 { font-size: 0.9rem; color: var(--primary); margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .advice-box p { font-size: 0.78rem; color: #555; margin-bottom: 6px; }
        .advice-box img { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; margin-top: 4px; }
        .advice-box a { color: var(--primary); font-weight: bold; text-decoration: underline; font-size: 0.78rem; }

        .footer-actions { display: flex; justify-content: center; align-items: center; border-top: 1px solid rgba(197,168,128,0.4); padding-top: 10px; font-family: 'Segoe UI', sans-serif; }
        .btn-action { background-color: var(--primary); color: white; padding: 8px 22px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; border: none; text-decoration: none; display: inline-block; transition: background 0.2s; }
        .btn-action:hover { background-color: var(--accent); color: var(--primary); }

        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 38, 58, 0.85); justify-content: center; align-items: center; z-index: 1000; font-family: 'Segoe UI', sans-serif;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 14px; width: 90%; max-width: 320px; text-align: center; border: 2px solid var(--accent);
        }
        .modal-content input {
            width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; text-align: center;
        }
        .modal-btn {
            background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;
        }
        .modal-btn:hover { background: var(--accent); color: var(--primary); }
    </style>
</head>
<body>
    <header>
        <div class="header-top-controls" id="admin-container">
            <button type="button" class="btn-admin" onclick="openPinModal()">⚙️ Admin</button>
        </div>
        <div class="brand-logo-container">
            <img src="https://i.postimg.cc/DzsCFbvh/IMG-0798.jpg" alt="Les Ozabris Logo">
        </div>
        <h1 class="logo-text">Les Ozabris</h1>
        <span class="subtitle">Cottages de Prestige & Perles Rares • La Réunion</span>
    </header>

    <div class="tv-card">
        <div class="card-header">
            <h2 id="page-main-title">Conseils & Recommandations</h2>
            <p id="page-main-sub" class="welcome-sub">🌿 Tout pour découvrir La Réunion et profiter pleinement de votre séjour aux Ozabris.</p>
        </div>

        <div class="advice-grid" id="advice-grid-container">
            <!-- Les conseils s'affichent automatiquement ici -->
        </div>
        
        <div class="footer-actions">
            <a id="back-home-btn" href="index.html" class="btn-action">🏠 Retour à l'accueil</a>
        </div>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <button type="button" onclick="closePinModal()" style="float: right; background: none; border: none; font-size: 1.1rem; cursor: pointer;">✕</button>
            <h3>🔒 Accès Admin</h3>
            <p style="font-size: 0.8rem; color: #666; margin: 5px 0;">Code PIN de sécurité</p>
            <input type="password" id="adminPin" placeholder="PIN" maxlength="6">
            <button type="button" class="modal-btn" onclick="verifyPin()">Valider</button>
            <p id="adminError" style="color: #b94a48; font-size: 0.75rem; margin-top: 8px; display: none;">Code incorrect</p>
        </div>
    </div>

    <script>
        // ==========================================
        // TES CONSEILS EN DUR (MODIFIABLES ICI DIRECTEMENT)
        // ==========================================
        const advicesList = [
            {
                active: true,
                target: "both", // "both" pour les deux gîtes, "ptitzabris", ou "grandzabris"
                title: "Super U 3B",
                text: "Supermarché le plus proche d'ici",
                img: "https://i.postimg.cc/m2/IMG-4328.jpg",
                linkText: "Horaires",
                linkUrl: "https://www.magasins-u.com"
            },
            {
                active: true,
                target: "ptitzabris",
                title: "Vanille Vallée",
                text: "Leurs sachets pour les préparation de Rhum arrangé",
                img: "https://i.postimg.cc/m2/IMG-4249.jpg",
                linkText: "En savoir plus",
                linkUrl: ""
            },
            {
                active: true,
                target: "both",
                title: "Le VORTEX Énergétique de l'Étang",
                text: "Un lieu hors du temps, un moment pour se ressourcer",
                img: "https://i.postimg.cc/50L/Image.jpg",
                linkText: "TripAdvisor",
                linkUrl: "https://www.tripadvisor.fr"
            },
            {
                active: true,
                target: "both",
                title: "Marché forain de St Paul",
                text: "Le plus grand marché de L'île ! Je vous conseille d'y aller tôt le matin.",
                img: "https://i.postimg.cc/d3Y/IMG-4380.jpg",
                linkText: "Guide Réunion",
                linkUrl: "https://www.ouest-lareunion.com"
            }
        ];

        let currentGite = 'ptitzabris';

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentGite = (urlParams.get('gite') || 'ptitzabris').toLowerCase();
            document.getElementById('back-home-btn').href = `index.html?gite=${currentGite}&v=99`;

            const isFullyKiosk = typeof window.fully !== 'undefined' || navigator.userAgent.includes("Fully");
            const adminContainer = document.getElementById('admin-container');
            const currentHost = window.location.hostname;
            const isBoxTV = currentHost.endsWith(".93") || currentHost.endsWith(".145") || currentHost === "192.168.1.93" || currentHost === "192.168.1.145";

            if (isFullyKiosk || isBoxTV) {
                adminContainer.style.display = 'none';
            } else {
                adminContainer.style.display = 'block';
            }

            renderAdvices();

            const adminPin = document.getElementById('adminPin');
            if (adminPin) {
                adminPin.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') verifyPin();
                });
            }
        }

        function renderAdvices() {
            const container = document.getElementById('advice-grid-container');
            container.innerHTML = "";

            advicesList.forEach(adv => {
                const targetVal = String(adv.target || 'both').toLowerCase();
                let matchGite = false;

                if (targetVal === 'both' || targetVal === 'les deux' || targetVal === 'tous') {
                    matchGite = true;
                } else if (currentGite === 'grandzabris' && targetVal.includes('grand')) {
                    matchGite = true;
                } else if (currentGite === 'ptitzabris' && (targetVal.includes('ptit') || targetVal.includes('petit'))) {
                    matchGite = true;
                }

                if (adv.active && matchGite) {
                    const box = document.createElement('div');
                    box.className = 'advice-box';
                    
                    let linkHtml = "";
                    if (adv.linkUrl) {
                        linkHtml = `<p style="margin-top: 4px;"><a href="${adv.linkUrl}" target="_blank">${adv.linkText || 'En savoir plus'} ↗</a></p>`;
                    }

                    box.innerHTML = `
                        <div>
                            <h3>${adv.title || 'Conseil'}</h3>
                            <p>${adv.text || ''}</p>
                            ${linkHtml}
                        </div>
                        <img src="${adv.img}" alt="${adv.title || 'Conseil'}">
                    `;
                    container.appendChild(box);
                }
            });

            if (container.innerHTML === "") {
                container.innerHTML = `<p style="text-align: center; color: #666; font-family: 'Segoe UI', sans-serif; grid-column: span 2; padding: 20px;">Aucun conseil actif pour ce gîte.</p>`;
            }
        }

        function openPinModal() {
            document.getElementById('admin-modal').style.display = 'flex';
            document.getElementById('adminPin').focus();
        }
        function closePinModal() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('adminError').style.display = 'none';
            document.getElementById('adminPin').value = '';
        }
        function verifyPin() {
            const pin = document.getElementById('adminPin').value.trim();
            if (pin === '140769') {
                closePinModal();
                alert("Pour modifier vos conseils, il vous suffit de modifier directement le tableau `advicesList` tout en haut du code JavaScript de cette page !");
            } else {
                document.getElementById('adminError').style.display = 'block';
                document.getElementById('adminPin').value = '';
            }
        }
    </script>
</body>
</html>

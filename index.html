
<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const gite = params.get('gite') === 'grandzabris'
    ? 'grandzabris' : 'ptitzabris';
  const isTV = params.get('tv') === '1';

  const VOYAGEURS_API =
    'https://script.google.com/macros/s/AKfycbx8IpsGljXVcaPPMIU54K9aCsQqdIK_KzsvelChbG4dMUpeVSHaAnKu2Ww8CAsl-2Qq/exec';

  const CONSEILS_API =
    'https://script.google.com/macros/s/AKfycbxS9JcDvy7gGhPFXE3z1a4DVC3pvq-j2MTSbaxDuz3Z6z80AkS3GP5mNpZyibillwDVFg/exec';

  const WEATHER_API =
    'https://api.open-meteo.com/v1/forecast?latitude=-21.01&longitude=55.27&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Indian%2FReunion';

  const SANIBROYEUR_PDF =
    'https://1drv.ms/b/c/b302293c3a107d46/IQDKMy1gsI-VT57f-TffvFLZAYGZgWF8Su3TW7D9aAyesKE';

  const TRI_PDF =
    'https://1drv.ms/b/c/b302293c3a107d46/IQDZPE7hVWyzR6Je11v5GxJpAQHKVJVyvyy-wpi8A10WimU';

  const PHOTO_NAMES = [
    'flamboyant.jpeg',
    'jacaranda.jpeg',
    'ansedescascade.jpeg',
    'apmechant.jpeg',
    'baleine2.jpeg',
    'banian.jpeg',
    'barachois.jpeg',
    'brasciloaos.jpeg',
    'buslontan.jpeg',
    'cascade.jpeg',
    'cascadelangevin.jpeg',
    'casehaut.jpeg',
    'caselontan.jpeg',
    'champscanne.jpeg',
    'crepusculetropical.jpeg',
    'dolomieu.jpeg',
    'endormi.jpeg',
    'flamboyantgros.jpeg',
    'gouzou.jpeg',
    'langevin.jpeg',
    'marchelontan.jpeg',
    'marchetraditionnel.jpeg',
    'papangue.jpeg',
    'pitondesneiges.jpeg',
    'plainedescafres.jpeg',
    'plainedespalmistes.jpeg',
    'reunionnaise.jpeg',
    'reunionnaise2.jpeg',
    'salazie.jpeg',
    'sucrerie.jpeg',
    'villelontan.jpeg',
    'volcan.jpeg'
  ];

  const PHOTO_URLS = PHOTO_NAMES.map(
    name => 'images/fond/' + name
  );

  let language = 'fr';
  let currentGuest = null;
  let weatherData = null;

  const translations = {
    fr: {
      welcome: 'Bienvenue',
      welcomeGuest: 'Bienvenue à Zot !',
      subtitle: 'aux Ozabris',
      stay: 'Profitez pleinement de votre séjour.',
      guestStay: 'Nous vous souhaitons un merveilleux séjour.',
      weatherLoading: 'Chargement de la météo…',
      weatherUnavailable: 'Météo indisponible',
      humidity: 'Humidité',
      wind: 'Vent'
    },
    en: {
      welcome: 'Welcome',
      welcomeGuest: 'Welcome',
      subtitle: 'to Les Ozabris',
      stay: 'Enjoy every moment of your stay.',
      guestStay: 'We wish you a wonderful stay.',
      weatherLoading: 'Loading weather…',
      weatherUnavailable: 'Weather unavailable',
      humidity: 'Humidity',
      wind: 'Wind'
    },
    de: {
      welcome: 'Willkommen',
      welcomeGuest: 'Willkommen',
      subtitle: 'bei Les Ozabris',
      stay: 'Genießen Sie Ihren Aufenthalt.',
      guestStay: 'Wir wünschen Ihnen einen schönen Aufenthalt.',
      weatherLoading: 'Wetter wird geladen…',
      weatherUnavailable: 'Wetter nicht verfügbar',
      humidity: 'Luftfeuchtigkeit',
      wind: 'Wind'
    }
  };

  function t(key) {
    return (translations[language] || translations.fr)[key]
      || translations.fr[key] || key;
  }

  function setText(id, value) {
    const el = $(id);
    if (el) el.textContent = value;
  }

  function suffix(tv) {
    return '?gite=' + encodeURIComponent(gite) +
      (tv && isTV ? '&tv=1' : '');
  }

  function configureLinks() {
    const guide = 'guide.html' + suffix(true);
    const conseils = 'conseils.html' + suffix(true);

    ['topGuide', 'heroGuide', 'featureGuide',
      'menuGuide'].forEach(id => {
      if ($(id)) $(id).href = guide;
    });

    ['topConseils', 'heroConseils', 'featureConseils',
      'menuConseils', 'islandLink'].forEach(id => {
      if ($(id)) $(id).href = conseils;
    });

    document.querySelectorAll('.guide-shortcut')
      .forEach(el => el.href = guide);

    if (isTV && $('adminButton')) {
      $('adminButton').style.display = 'none';
    }

    if ($('ozNotificationLink')) {
      $('ozNotificationLink').href = conseils;
    }
  }

  function createQr(id, url) {
    const box = $(id);
    if (!box) return;

    box.innerHTML = '';

    if (typeof QRCode === 'undefined') {
      const a = document.createElement('a');
      a.href = url;
      a.textContent = 'Ouvrir';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      box.appendChild(a);
      return;
    }

    new QRCode(box, {
      text: url,
      width: 116,
      height: 116,
      colorDark: '#12263a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  function configureQr() {
    createQr(
      'qrHome',
      new URL('index.html' + suffix(false), location.href).href
    );
    createQr(
      'qrGuide',
      new URL('guide.html' + suffix(false), location.href).href
    );
    createQr(
      'qrConseils',
      new URL('conseils.html' + suffix(false), location.href).href
    );
    createQr('qrSanibroyeur', SANIBROYEUR_PDF);
    createQr('qrTri', TRI_PDF);
  }

  function photoExists(url) {
    return new Promise(resolve => {
      const img = new Image();
      let finished = false;

      const finish = ok => {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        resolve(ok);
      };

      const timeout = setTimeout(
        () => finish(false), 6000
      );

      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      img.src = url;
    });
  }

  async function availablePhotos() {
    const checks = await Promise.all(
      PHOTO_URLS.map(async url => ({
        url,
        ok: await photoExists(url)
      }))
    );
    return checks.filter(x => x.ok).map(x => x.url);
  }

  function createRibbon(id, photos, offset, columns) {
    const host = $(id);
    if (!host || !photos.length) return;

    const track = host.querySelector('.ribbon-track');
    if (!track) return;

    let width = 0;
    let position = 0;
    let last = 0;
    let index = offset;

    function nextUrl() {
      return photos[(index++) % photos.length];
    }

    function tile(url) {
      const div = document.createElement('div');
      div.className = 'ribbon-tile';

      const img = document.createElement('img');
      img.src = url;
      img.alt = '';
      img.decoding = 'async';

      div.appendChild(img);
      return div;
    }

    function resize() {
      const newWidth = host.clientWidth / columns;
      if (!newWidth) return;

      if (width) {
        position = position / width * newWidth;
      }

      width = newWidth;

      Array.from(track.children).forEach(el => {
        el.style.width = width + 'px';
      });

      track.style.transform =
        'translate3d(' + (-position) + 'px,0,0)';
    }

    for (let i = 0; i < columns + 3; i++) {
      track.appendChild(tile(nextUrl()));
    }

    resize();
    window.addEventListener('resize', resize);

    function tick(now) {
      if (last && !document.hidden && width) {
        const dt = Math.min((now - last) / 1000, 0.08);
        position += dt * 12;

        while (position >= width) {
          position -= width;
          track.removeChild(track.firstElementChild);
          const el = tile(nextUrl());
          el.style.width = width + 'px';
          track.appendChild(el);
        }

        track.style.transform =
          'translate3d(' + (-position) + 'px,0,0)';
      }

      last = now;
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  }

  function createFeatureSlideshow(id, photos, offset) {
    const host = $(id);
    if (!host || !photos.length) return;

    const img = host.querySelector('img');
    if (!img) return;

    let index = offset % photos.length;
    img.src = photos[index];

    if (photos.length < 2) return;

    setInterval(() => {
      if (document.hidden) return;

      index = (index + 1) % photos.length;
      img.style.opacity = '0.25';

      setTimeout(() => {
        img.src = photos[index];
        img.style.opacity = '1';
      }, 500);
    }, 120000);

    img.style.transition = 'opacity .6s ease';
  }

  async function startPhotos() {
    const photos = await availablePhotos();
    if (!photos.length) return;

    createRibbon('heroRibbon', photos, 0, 3);
    createFeatureSlideshow('guideSlideshow', photos, 1);
    createFeatureSlideshow('conseilsSlideshow', photos, 2);
  }

  function updateClock() {
    const now = new Date();
    const locale = language === 'de' ? 'de-DE'
      : language === 'en' ? 'en-GB' : 'fr-FR';

    setText('localDate', new Intl.DateTimeFormat(locale, {
      timeZone: 'Indian/Reunion',
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }).format(now));

    setText('localTime', new Intl.DateTimeFormat(locale, {
      timeZone: 'Indian/Reunion',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).format(now) + ' · UTC+4');
  }

  function renderWeather() {
    if (!weatherData) {
      setText('weatherDescription', t('weatherLoading'));
      return;
    }

    const w = weatherData;
    const code = Number(w.weather_code);

    let icon = '🌤️';
    let description = 'Partiellement nuageux';

    if (code === 0) {
      icon = '☀️';
      description = 'Ciel dégagé';
    } else if ([95, 96, 99].includes(code)) {
      icon = '⛈️';
      description = 'Orages';
    } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82]
      .includes(code)) {
      icon = '🌧️';
      description = 'Pluie';
    }

    setText('weatherIcon', icon);
    setText('temperature',
      Math.round(w.temperature_2m) + '°C');
    setText('weatherDescription', description);
    setText('weatherExtra',
      t('humidity') + ' : ' +
      w.relative_humidity_2m + '% · ' +
      t('wind') + ' : ' +
      Math.round(w.wind_speed_10m) + ' km/h');
  }

  async function loadWeather() {
    try {
      const response = await fetch(WEATHER_API, {
        cache: 'no-store'
      });

      if (!response.ok) throw Error('Météo indisponible');

      const data = await response.json();
      if (!data.current) throw Error('Données absentes');

      weatherData = data.current;
      renderWeather();
    } catch (error) {
      if (!weatherData) {
        setText('weatherDescription', t('weatherUnavailable'));
      }
    }
  }

  function normalize(value) {
    return String(value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/\s+/g, '');
  }

  function parseDate(value) {
    if (!value) return null;

    const match = String(value)
      .match(/^(\d{4})-(\d{2})-(\d{2})/);

    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3])
      );
    }

    const date = new Date(value);
    return isNaN(date.getTime()) ? null : date;
  }

  function reunionToday() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Indian/Reunion',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).formatToParts(new Date());

    const v = {};
    parts.forEach(p => v[p.type] = p.value);

    return new Date(
      Number(v.year),
      Number(v.month) - 1,
      Number(v.day)
    );
  }

  function translatePage() {
    document.documentElement.lang = language;

    const title = $('heroTitle');
    if (title) {
      title.textContent = '';

      const first = document.createTextNode(
        currentGuest && currentGuest.prenom
          ? t('welcomeGuest') + ' '
          : t('welcome') + ' '
      );

      const em = document.createElement('em');
      em.textContent =
        currentGuest && currentGuest.prenom
          ? String(currentGuest.prenom).trim()
          : t('subtitle');

      title.appendChild(first);
      title.appendChild(em);
    }

    setText('cottageName',
      gite === 'grandzabris'
        ? 'Grandzabris' : 'Ptitzabris');

    setText('stayMessage',
      currentGuest ? t('guestStay') : t('stay'));

    updateClock();
    renderWeather();
  }

  async function loadVoyageur() {
    try {
      const response = await fetch(
        VOYAGEURS_API + '?t=' + Date.now(),
        { cache: 'no-store' }
      );

      if (!response.ok) return;

      const data = await response.json();
      const voyageurs = Array.isArray(data)
        ? data
        : Array.isArray(data.rows)
          ? data.rows
          : Array.isArray(data.data)
            ? data.data : [];

      const today = reunionToday();

      const actifs = voyageurs.filter(v => {
        if (!normalize(v.cottage).includes(gite)) {
          return false;
        }

        const arrivee = parseDate(
          v.arrivee || v.dateArrivee
        );

        const depart = parseDate(
          v.depart || v.dateDepart
        );

        return arrivee && depart &&
          arrivee <= today && today <= depart;
      });

      currentGuest = actifs.length
        ? actifs[actifs.length - 1] : null;

      const lang = currentGuest
        ? String(currentGuest.langue || 'fr')
          .toLowerCase().substring(0, 2)
        : 'fr';

      language = translations[lang] ? lang : 'fr';
      translatePage();

    } catch (error) {
      console.warn('Voyageurs indisponibles');
    }
  }

  function configureEntertainment() {
    const appPackages = {
      netflix: 'com.netflix.ninja',
      orange: 'com.orange.owtv.tv',
      prime: 'com.amazon.amazonvideo.livingroom',
      youtube: 'com.google.android.youtube.tv'
    };

    function openLauncher() {
      if (!/Android/i.test(navigator.userAgent || '')) {
        setText('entertainmentStatus',
          'Cette fonction est réservée aux télévisions.');
        return;
      }

      setText('entertainmentStatus',
        'Ouverture des applications demandée…');

      location.href = 'fully://launcher';
    }

    document.querySelectorAll('[data-app]')
      .forEach(button => {
        button.addEventListener('click', () => {
          const app = button.dataset.app;
          if (appPackages[app]) openLauncher();
        });
      });

    if ($('openLauncher')) {
      $('openLauncher').addEventListener(
        'click', openLauncher
      );
    }
  }

  function configureAdmin() {
    const button = $('adminButton');
    const modal = $('adminModal');
    const confirm = $('confirmAdmin');
    const cancel = $('cancelAdmin');

    if (isTV) {
      if (button) button.style.display = 'none';
      return;
    }

    if (!button || !modal) return;

    button.addEventListener('click', () => {
      modal.hidden = false;
      modal.style.display = 'flex';
      if (confirm) confirm.focus();
    });

    function close() {
      modal.hidden = true;
      modal.style.display = 'none';
      button.focus();
    }

    if (cancel) cancel.addEventListener('click', close);

    if (confirm) {
      confirm.addEventListener('click', () => {
        location.href =
          'admin.html?gite=' + encodeURIComponent(gite);
      });
    }

    modal.addEventListener('click', e => {
      if (e.target === modal) close();
    });
  }

  function configureTVNavigation() {
    document.addEventListener('keydown', event => {
      if (![
        'ArrowUp', 'ArrowDown',
        'ArrowLeft', 'ArrowRight'
      ].includes(event.key)) return;

      const controls = Array.from(
        document.querySelectorAll(
          '.top-links a,.top-links button:not(.hidden),' +
          '.hero-button,.oz-menu-link,.feature-card,' +
          '.entertainment-card,#openLauncher,' +
          '.oz-info-card a,.oz-retour'
        )
      ).filter(el => el.getClientRects().length > 0 &&
        getComputedStyle(el).display !== 'none');

      if (!controls.length) return;

      const current = controls.indexOf(document.activeElement);
      const step = event.key === 'ArrowUp' ||
        event.key === 'ArrowLeft' ? -1 : 1;

      const next = current < 0 ? 0 :
        (current + step + controls.length) %
        controls.length;

      event.preventDefault();
      controls[next].focus();
      controls[next].scrollIntoView({
        block: 'nearest',
        behavior: 'smooth'
      });
    });
  }

  /* Notification des recommandations activées.
     La référence est mémorisée séparément par gîte.
     L'API doit renvoyer les conseils et leur activation. */

  const STORAGE_KEY = 'oz_conseils_v3_' + gite;
  let previousAdvice = null;

  function adviceRows(data) {
    if (Array.isArray(data)) return data;
    if (Array.isArray(data.conseils)) return data.conseils;
    if (Array.isArray(data.rows)) return data.rows;
    if (Array.isArray(data.data)) return data.data;
    return [];
  }

  function adviceId(row) {
    return String(
      row.id || row.ID || row.identifiant ||
      row.titre || row.nom || row.name || ''
    ).trim();
  }

  function adviceTitle(row) {
    return String(
      row.titre || row.nom || row.name ||
      row.etablissement || 'Une nouvelle adresse'
    ).trim();
  }

  function adviceActive(row) {
    const value =
      row.actif !== undefined ? row.actif :
      row.active !== undefined ? row.active :
      row.activation !== undefined ? row.activation :
      row.visible !== undefined ? row.visible : false;

    if (typeof value === 'object' && value !== null) {
      return adviceActive({
        actif: value[gite] !== undefined
          ? value[gite] : false
      });
    }

    return value === true || value === 1 ||
      ['true', '1', 'oui', 'yes', 'actif', 'active']
        .includes(String(value).toLowerCase());
  }

  function showAdviceNotification(title) {
    const notification = $('ozNotification');
    if (!notification) return;

    setText('ozNotificationTitle',
      '🌺 Nouveau conseil de Jean !');

    setText('ozNotificationText',
      title + ' est maintenant disponible pour ' +
      (gite === 'grandzabris'
        ? 'Grandzabris.' : 'Ptitzabris.'));

    notification.hidden = false;
  }

  async function checkNewAdvice() {
    try {
      const url = CONSEILS_API +
        '?type=conseils&gite=' +
        encodeURIComponent(gite) +
        '&t=' + Date.now();

      const response = await fetch(url, {
        cache: 'no-store'
      });

      if (!response.ok) return;

      const data = await response.json();
      const rows = adviceRows(data);

      const active = new Map();

      rows.forEach(row => {
        if (!row || typeof row !== 'object') return;
        if (!adviceActive(row)) return;

        const id = adviceId(row);
        if (id) active.set(id, adviceTitle(row));
      });

      const currentIds = Array.from(active.keys());

      if (previousAdvice === null) {
        let stored = null;

        try {
          stored = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
          );
        } catch (error) {}

        previousAdvice = Array.isArray(stored)
          ? stored : currentIds;

        if (!stored && currentIds.length) {
          showAdviceNotification(
            active.get(currentIds[currentIds.length - 1])
          );
        }
      } else {
        const newlyActive = currentIds.filter(
          id => !previousAdvice.includes(id)
        );

        if (newlyActive.length) {
          showAdviceNotification(
            active.get(newlyActive[newlyActive.length - 1])
          );
        }
      }

      previousAdvice = currentIds;

      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(currentIds)
        );
      } catch (error) {}

    } catch (error) {
      console.warn(
        'Vérification des recommandations indisponible',
        error
      );
    }
  }

  function configureNotifications() {
    const close = $('ozNotificationClose');
    if (close) {
      close.addEventListener('click', () => {
        $('ozNotification').hidden = true;
      });
    }

    checkNewAdvice();
    setInterval(checkNewAdvice, 60000);
  }

  configureLinks();
  configureQr();
  configureEntertainment();
  configureAdmin();
  configureTVNavigation();
  configureNotifications();

  translatePage();
  startPhotos();
  loadWeather();
  loadVoyageur();

  setInterval(updateClock, 30000);
  setInterval(loadWeather, 1800000);
  setInterval(loadVoyageur, 300000);

})();
</script>

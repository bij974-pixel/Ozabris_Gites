<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title-meta">Guide du Cottage | Les Ozabris</title>
    <!-- Inclusion de la bibliothèque qrcode.js pour générer les QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #12263a; --accent: #c5a880; --text-dark: #2c3e50; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Playfair Display', 'Georgia', serif; }
        
        body {
            width: 100vw;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background: linear-gradient(rgba(18, 38, 58, 0.75), rgba(18, 38, 58, 0.85)), url('fond_page.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header { 
            background: var(--primary);
            text-align: center; 
            padding: 12px 20px; 
            position: relative; 
            color: var(--white);
            width: 100%;
            max-width: 950px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            border: 2px solid var(--accent);
            border-bottom: none;
            flex-shrink: 0;
        }

        .header-top-controls { position: absolute; top: 8px; right: 15px; display: block; z-index: 10; }
        .btn-admin {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.75rem;
            background: var(--accent);
            border: 1px solid var(--accent);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
        }

        .brand-logo-container { max-width: 75px; margin: 0 auto 2px auto; overflow: hidden; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 2px solid var(--accent); }
        .brand-logo-container img { width: 100%; height: auto; object-fit: contain; display: block; }
        
        .logo-text { font-size: 1.2rem; font-weight: 300; letter-spacing: 2px; color: var(--white); text-transform: uppercase; margin-bottom: 0px; }
        .subtitle { font-family: 'Segoe UI', sans-serif; font-size: 0.55rem; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; display: block; }

        .tv-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 950px;
            height: 75vh;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            padding: 15px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 2px solid var(--accent);
            border-top: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            margin: auto;
            position: relative;
        }

        .card-header { margin-bottom: 6px; flex-shrink: 0; }
        h2 { color: var(--primary); font-size: 1.2rem; font-weight: 400; margin-bottom: 2px; }
        .welcome-sub { font-family: 'Segoe UI', sans-serif; font-size: 0.68rem; color: #555; font-style: italic; }

        /* Grille de cartes scrollable pour une navigation télécommande fluide */
        .guide-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            overflow-y: auto; 
            padding: 5px; 
            flex-grow: 1;
            align-content: start;
        }
        .guide-grid::-webkit-scrollbar { width: 8px; }
        .guide-grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        
        .guide-box { 
            background: var(--white); 
            border: 2px solid var(--accent); 
            border-radius: 10px; 
            padding: 12px; 
            text-align: left; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: row; 
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 105px;
        }
        .guide-box:focus, .guide-box:hover {
            border-color: #12263a;
            box-shadow: 0 0 12px rgba(18, 38, 58, 0.4);
            outline: none;
            transform: scale(1.01);
            background: #fffdf9;
        }

        .guide-content-area { flex-grow: 1; overflow: hidden; }
        .guide-box h3 { font-size: 0.85rem; color: var(--primary); margin-bottom: 3px; font-family: 'Playfair Display', serif; }
        .guide-box p { font-size: 0.72rem; color: #555; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .guide-thumb {
            width: 75px;
            height: 75px;
            flex-shrink: 0;
            border-radius: 6px;
            border: 1px solid #ddd;
            object-fit: contain;
            background: #fcfbfa;
            padding: 2px;
        }

        .tv-instruction-box {
            grid-column: span 2;
            background: #fdfcfb;
            border: 2px dashed var(--accent);
            border-radius: 10px;
            padding: 10px 15px;
            text-align: left;
            font-family: 'Segoe UI', sans-serif;
        }
        .tv-instruction-box h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 3px;
        }
        .tv-instruction-box p {
            font-size: 0.72rem;
            color: #444;
            line-height: 1.35;
        }

        .footer-actions { display: flex; justify-content: center; align-items: center; border-top: 1px solid rgba(197,168,128,0.4); padding-top: 8px; font-family: 'Segoe UI', sans-serif; flex-shrink: 0; }
        .btn-action { background-color: var(--primary); color: white; padding: 6px 18px; border-radius: 8px; font-weight: 600; font-size: 0.72rem; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-action:focus { outline: 3px solid var(--accent); }

        /* Mode Plein Écran interactif */
        #fullscreen-view {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(18, 38, 58, 0.96); z-index: 5000; justify-content: center; align-items: center; padding: 20px; font-family: 'Segoe UI', sans-serif;
        }
        .fullscreen-card {
            background: white; width: 100%; max-width: 820px; max-height: 92vh; border-radius: 16px; padding: 25px; border: 3px solid var(--accent); box-shadow: 0 25px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; text-align: center;
        }
        .fullscreen-card h3 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: 1.5rem; margin-bottom: 8px; text-align: left; }
        .fullscreen-card p.fs-desc { font-size: 0.95rem; color: #333; line-height: 1.5; margin-bottom: 15px; text-align: left; }
        
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fdfcfb;
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .qr-container p { font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-bottom: 10px; font-family: 'Segoe UI', sans-serif; text-align: center; }
        #qrcode-box { background: white; padding: 10px; border-radius: 6px; border: 1px solid #eee; display: inline-block; }

        .btn-close-fullscreen { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; align-self: center; }
        .btn-close-fullscreen:hover, .btn-close-fullscreen:focus { background: var(--accent); color: var(--primary); outline: none; }

        /* Modale PIN Admin */
        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(18, 38, 58, 0.9); justify-content: center; align-items: center; z-index: 10000; font-family: 'Segoe UI', sans-serif;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 300px; text-align: center; border: 2px solid var(--accent);
        }
        .modal-content input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; text-align: center; }
        .modal-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-top-controls" id="admin-container">
            <button type="button" class="btn-admin" onclick="openPinModal()">⚙️ Admin</button>
        </div>
        <div class="brand-logo-container">
            <img src="https://i.postimg.cc/DzsCFbvh/IMG-0798.jpg" alt="Les Ozabris Logo">
        </div>
        <h1 class="logo-text">Les Ozabris</h1>
        <span class="subtitle" id="sub-brand-title">Cottages de Prestige & Perles Rares • La Réunion</span>
    </header>

    <div class="tv-card">
        <div class="card-header">
            <h2 id="page-main-title">Guide du Cottage & Infos pratiques</h2>
            <p id="page-main-sub" class="welcome-sub">✨ Utilisez votre télécommande pour faire défiler et sélectionner une carte.</p>
        </div>

        <div class="guide-grid" id="guide-grid-container">
            <p style="text-align: center; color: #666; grid-column: span 2; padding: 20px;">Chargement...</p>
        </div>
        
        <div class="footer-actions">
            <a id="back-home-btn" href="index.html" class="btn-action">🏠 Retour à l'accueil</a>
        </div>
    </div>

    <!-- Mode Plein Écran -->
    <div id="fullscreen-view">
        <div class="fullscreen-card">
            <div>
                <h3 id="fs-title">Titre</h3>
                <p id="fs-text" class="fs-desc">Description...</p>
                <div id="fs-media-container" style="text-align: center;"></div>
            </div>
            <button type="button" class="btn-close-fullscreen" id="close-fs-btn" onclick="closeFullscreen()">✕ Quitter et revenir</button>
        </div>
    </div>

    <!-- Modale PIN Admin -->
    <div id="admin-modal">
        <div class="modal-content">
            <button type="button" onclick="closePinModal()" style="float: right; background: none; border: none; font-size: 1.1rem; cursor: pointer;">✕</button>
            <h3 id="admin-modal-title">🔒 Accès Admin</h3>
            <p id="admin-modal-sub" style="font-size: 0.8rem; color: #666; margin: 4px 0;">Code PIN de sécurité</p>
            <input type="password" id="adminPin" placeholder="PIN" maxlength="6">
            <button type="button" class="modal-btn" id="admin-modal-btn" onclick="verifyPin()">Valider</button>
            <p id="adminError" style="color: #b94a48; font-size: 0.7rem; margin-top: 6px; display: none;">Code incorrect</p>
        </div>
    </div>

    <script>
        const sheetVoyageursApiUrl = "https://script.google.com/macros/s/AKfycbx8IpsGljXVcaPPMIU54K9aCsQqdIK_KzsvelChbG4dMUpeVSHaAnKu2Ww8CAsl-2Qq/exec";

        let currentGiteKey = 'ptitzabris';
        let currentLang = 'fr';

        const guideData = {
            fr: {
                titleFor: "Guide du Cottage pour {name}",
                titleAt: "Guide du Cottage - {cottage}",
                subText: "✨ Utilisez votre télécommande pour faire défiler et sélectionner une carte.",
                backHome: "🏠 Retour à l'accueil",
                closeBtn: "✕ Quitter et revenir",
                qrText: "📱 Pour consulter le document en ligne depuis votre téléphone, scannez ce QR code :",
                adminTitle: "🔒 Accès Admin",
                adminSub: "Code PIN de sécurité",
                adminBtn: "Valider",
                adminErr: "Code incorrect",
                tvBoxTitle: "📺 Comment regarder la télévision en direct ?",
                tvBoxDesc: "Pour profiter des chaînes TV, quittez le mode Kiosk (en faisant glisser le doigt depuis le bord de l'écran ou via la télécommande), puis lancez l'application <b>Orange TV</b> depuis l'accueil de la box.",
                items: [
                    {
                        title: "📶 Connexion Wi-Fi",
                        desc: "Réseau 1 : SFR_JR (mdp : 02311760)\nRéseau 2 : SFR_JR_GZ (mdp : 02311760)\nRéseau 3 : LeGrandZabris (mdp : Reunion974*)\nSaisissez manuellement le nom du réseau et le mot de passe sur votre appareil.",
                        linkUrl: ""
                    },
                    {
                        title: "🚽 Notice Sanibroyeur",
                        desc: "Consultez les instructions importantes d'utilisation pour préserver le bon fonctionnement des installations.",
                        linkUrl: "https://1drv.ms/b/c/b302293c3a107d46/IQDKMy1gsI-VT57f-TffvFLZAYGZgWF8Su3TW7D9aAyesKE"
                    },
                    {
                        title: "🗑️ Gestion des déchets & Tri",
                        desc: "Tout savoir sur le tri sélectif et la gestion des déchets pour préserver La Réunion.",
                        linkUrl: "https://1drv.ms/b/c/b302293c3a107d46/IQDZPE7hVWyzR6Je11v5GxJpAQHKVJVyvyy-wpi8A10WimU"
                    },
                    {
                        title: "🌿 Charte & Sécurité du Domaine",
                        desc: "Consignes de calme, de respect de la nature et de sécurité aux Ozabris.",
                        linkUrl: ""
                    }
                ]
            },
            en: {
                titleFor: "Cottage Guide for {name}",
                titleAt: "Cottage Guide - {cottage}",
                subText: "✨ Use your remote control to scroll and select a card.",
                backHome: "🏠 Back to Home",
                closeBtn: "✕ Exit and Return",
                qrText: "📱 To view the document online from your phone, scan this QR code:",
                adminTitle: "🔒 Admin Access",
                adminSub: "Security PIN code",
                adminBtn: "Validate",
                adminErr: "Incorrect code",
                tvBoxTitle: "📺 How to watch live television?",
                tvBoxDesc: "To watch TV channels, exit Kiosk mode (by swiping from the edge of the screen or using your remote control), then open the <b>Orange TV</b> application from the box home screen.",
                items: [
                    {
                        title: "📶 Wi-Fi Connection",
                        desc: "Network 1: SFR_JR (password: 02311760)\nNetwork 2: SFR_JR_GZ (password: 02311760)\nNetwork 3: LeGrandZabris (password: Reunion974*)\nEnter network name and password manually on your device.",
                        linkUrl: ""
                    },
                    {
                        title: "🚽 Sanibroyeur Guide",
                        desc: "Check important usage instructions to ensure proper operation of the facilities.",
                        linkUrl: "https://1drv.ms/b/c/b302293c3a107d46/IQDKMy1gsI-VT57f-TffvFLZAYGZgWF8Su3TW7D9aAyesKE"
                    },
                    {
                        title: "🗑️ Waste Management & Sorting",
                        desc: "Everything you need to know about waste sorting to preserve La Réunion.",
                        linkUrl: "https://1drv.ms/b/c/b302293c3a107d46/IQDZPE7hVWyzR6Je11v5GxJpAQHKVJVyvyy-wpi8A10WimU"
                    },
                    {
                        title: "🌿 Estate Guidelines & Safety",
                        desc: "Quiet hours, nature preservation, and safety rules at Les Ozabris.",
                        linkUrl: ""
                    }
                ]
            },
            de: {
                titleFor: "Cottage-Leitfaden für {name}",
                titleAt: "Cottage-Leitfaden - {cottage}",
                subText: "✨ Nutzen Sie Ihre Fernbedienung zum Scrollen und Auswählen.",
                backHome: "🏠 Zur Startseite",
                closeBtn: "✕ Schließen und Zurück",
                qrText: "📱 Um das Dokument online von Ihrem Telefon aus anzusehen, scannen Sie diesen QR-Code:",
                adminTitle: "🔒 Admin-Zugang",
                adminSub: "Sicherheits-PIN-Code",
                adminBtn: "Bestätigen",
                adminErr: "Falscher Code",
                tvBoxTitle: "📺 Wie schaue ich Live-Fernsehen?",
                tvBoxDesc: "Um TV-Sender zu sehen, verlassen Sie den Kiosk-Modus und starten Sie die App <b>Orange TV</b> auf dem Startbildschirm der Box.",
                items: [
                    {
                        title: "📶 WLAN-Verbindung",
                        desc: "Netzwerk 1: SFR_JR (Passwort: 02311760)\nNetzwerk 2: SFR_JR_GZ (Passwort: 02311760)\nNetzwerk 3: LeGrandZabris (Passwort: Reunion974*)\nGeben Sie den Netzwerknamen und das Passwort manuell auf Ihrem Gerät ein.",
                        linkUrl: ""
                    },
                    {
                        title: "🚽 Sanibroyeur-Anleitung",
                        desc: "Wichtige Bedienungshinweise für den einwandfreien Betrieb der Anlage.",
                        linkUrl: "https://1drv.ms/b/c/b302293c3a107d46/IQDKMy1gsI-VT57f-TffvFLZAYGZgWF8Su3TW7D9aAyesKE"
                    },
                    {
                        title: "🗑️ Mülltrennung & Recycling",
                        desc: "Wissenswertes über die Mülltrennung zum Schutz von La Réunion.",
                        linkUrl: "https://1drv.ms/b/c/b302293c3a107d46/IQDZPE7hVWyzR6Je11v5GxJpAQHKVJVyvyy-wpi8A10WimU"
                    },
                    {
                        title: "🌿 Anwesen-Regeln & Sicherheit",
                        desc: "Ruhezeiten, Naturschutz und Sicherheitsregeln in Les Ozabris.",
                        linkUrl: ""
                    }
                ]
            }
        };

        function t(key, replacements = {}) {
            let langDict = guideData[currentLang] || guideData['fr'];
            let text = langDict[key] || guideData['fr'][key] || key;
            for (const [k, v] of Object.entries(replacements)) {
                text = text.replace(new RegExp(`{${k}}`, 'g'), v);
            }
            return text;
        }

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const giteParam = (urlParams.get('gite') || 'ptitzabris').toLowerCase();
            currentGiteKey = giteParam.includes("grand") ? "grandzabris" : "ptitzabris";
            let cottageName = currentGiteKey === "grandzabris" ? "Grandzabris" : "Ptitzabris";

            document.getElementById('back-home-btn').href = `index.html?gite=${currentGiteKey}&v=99`;

            // SÉCURITÉ : Masquage strict du bouton Admin UNIQUEMENT pour .145 et .93
            const adminContainer = document.getElementById('admin-container');
            const currentHost = window.location.hostname;
            const isTargetTV = currentHost.endsWith(".145") || currentHost.endsWith(".93") || 
                               currentHost === "192.168.1.145" || currentHost === "192.168.1.93";

            if (isTargetTV) {
                adminContainer.style.display = 'none';
            } else {
                adminContainer.style.display = 'block';
            }

            try {
                const resV = await fetch(sheetVoyageursApiUrl + "?t=" + new Date().getTime());
                const voyageurs = await resV.json();
                const today = new Date();
                today.setHours(0,0,0,0);
                
                let voyageurActuel = null;
                if (Array.isArray(voyageurs) && voyageurs.length > 0) {
                    voyageurActuel = voyageurs.find(item => {
                        const cStr = String(item.cottage || '').toLowerCase();
                        const matchC = currentGiteKey === 'grandzabris' ? cStr.includes('grand') : (cStr.includes('ptit') || cStr.includes('petit'));
                        const arr = item.dateArrivee || item.arrivee;
                        const dep = item.dateDepart || item.depart;
                        if (matchC && arr && dep) {
                            const dArr = new Date(arr);
                            const dDep = new Date(dep);
                            dArr.setHours(0,0,0,0);
                            dDep.setHours(0,0,0,0);
                            return today >= dArr && today <= dDep;
                        }
                        return false;
                    });
                }

                if (voyageurActuel) {
                    if (voyageurActuel.langue) {
                        const l = voyageurActuel.langue.toLowerCase().trim();
                        if (['fr', 'en', 'de'].includes(l)) {
                            currentLang = l;
                        }
                    }
                    if (voyageurActuel.prenom) {
                        document.getElementById('page-main-title').innerText = t('titleFor', { name: voyageurActuel.prenom });
                    } else {
                        document.getElementById('page-main-title').innerText = t('titleAt', { cottage: cottageName });
                    }
                } else {
                    document.getElementById('page-main-title').innerText = t('titleAt', { cottage: cottageName });
                }
            } catch(e) {
                document.getElementById('page-main-title').innerText = t('titleAt', { cottage: cottageName });
            }

            document.getElementById('page-main-sub').innerText = t('subText');
            document.getElementById('back-home-btn').innerText = t('backHome');
            document.getElementById('close-fs-btn').innerText = t('closeBtn');
            document.getElementById('admin-modal-title').innerText = t('adminTitle');
            document.getElementById('admin-modal-sub').innerText = t('adminSub');
            document.getElementById('admin-modal-btn').innerText = t('adminBtn');

            renderGuideGrid();
        }

        function renderGuideGrid() {
            const container = document.getElementById('guide-grid-container');
            container.innerHTML = "";

            const langData = guideData[currentLang] || guideData['fr'];

            // Encadré TV en haut
            const tvBox = document.createElement('div');
            tvBox.className = 'tv-instruction-box';
            tvBox.innerHTML = `
                <h3>${langData.tvBoxTitle}</h3>
                <p>${langData.tvBoxDesc}</p>
            `;
            container.appendChild(tvBox);

            langData.items.forEach((item) => {
                const box = document.createElement('div');
                box.className = 'guide-box';
                box.setAttribute('tabindex', '0');

                const triggerAction = function(e) {
                    e.preventDefault();
                    openFullscreen(item.title, item.desc, item.linkUrl);
                };

                box.onclick = triggerAction;
                box.ontouchend = triggerAction;
                box.onkeydown = function(e) {
                    if (e.key === 'Enter' || e.keyCode === 13) triggerAction(e);
                };

                // Formatage des retours à la ligne pour l'affichage dans la carte
                let formattedDesc = item.desc.replace(/\n/g, '<br>');

                box.innerHTML = `
                    <div class="guide-content-area">
                        <h3>${item.title}</h3>
                        <p>${formattedDesc}</p>
                    </div>
                `;
                container.appendChild(box);
            });
        }

        function openFullscreen(title, text, linkUrl) {
            document.getElementById('fs-title').innerText = title;
            document.getElementById('fs-text').innerText = text.replace(/\n/g, '<br>');
            
            const mediaContainer = document.getElementById('fs-media-container');
            mediaContainer.innerHTML = "";

            if (linkUrl && linkUrl.trim() !== "" && linkUrl.startsWith("http")) {
                const qrWrapper = document.createElement('div');
                qrWrapper.className = 'qr-container';
                qrWrapper.innerHTML = `
                    <p>${t('qrText')}</p>
                    <div id="qrcode-box"></div>
                `;
                mediaContainer.appendChild(qrWrapper);

                try {
                    new QRCode(document.getElementById("qrcode-box"), {
                        text: linkUrl.trim(),
                        width: 150,
                        height: 150,
                        colorDark: "#12263a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch(err) {
                    document.getElementById("qrcode-box").innerText = linkUrl.trim();
                }
            }

            document.getElementById('fullscreen-view').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('close-fs-btn').focus();
            }, 100);
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-view').style.display = 'none';
        }

        function openPinModal() {
            document.getElementById('admin-modal').style.display = 'flex';
            document.getElementById('adminPin').focus();
        }
        function closePinModal() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('adminError').style.display = 'none';
            document.getElementById('adminPin').value = '';
        }
        function verifyPin() {
            const pin = document.getElementById('adminPin').value.trim();
            if (pin === '140769') {
                window.location.href = `admin.html?gite=${currentGiteKey}`;
